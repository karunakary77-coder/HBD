<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Shanvika Yadav</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 3em;
      margin-top: 0.5em;
    }
    p {
      font-size: 1.4em;
      margin: 1em 0;
    }
    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 2em 0;
    }
    .photos img {
      width: 100%;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    footer {
      margin-top: 3em;
      font-size: 1em;
      color: #ffe0e0;
    }
  </style>
</head>
<body>
  <h1>🎉 Happy Birthday Shanvika Yadav 🎂</h1>
  <p>You make my world brighter every single day.</p>
  <p>Your smile is my sunshine, and your love is my peace.</p>
  <p>I love you, <strong>Dii</strong> 💕</p>
  <p>— With all my love, Karunakar 💖</p>

  <div class="photos">
    <img src="photo1.jpg" alt="Shanvika 1">
    <img src="photo2.jpg" alt="Shanvika 2">
    <img src="photo3.jpg" alt="Shanvika 3">
    <img src="photo4.jpg" alt="Shanvika 4">
  </div>

  <footer>
    Made with ❤️ by Karunakar for his Queen Shanvika
  </footer>
</body>
</html>
